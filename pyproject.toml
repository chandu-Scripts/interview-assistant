[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-assistant"
version = "0.1.1"
description = "Windows desktop AI interview assistant"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "httpx>=0.27",
    "websockets>=15,<16",
    "faster-whisper>=1.0",
    "PyAudioWPatch>=0.2.12.8; sys_platform == 'win32'",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-qt>=4.4", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
interview-assistant = "interview_assistant.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interview_assistant = ["assets/semantic/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # developer tooling: long literal strings (shell/PowerShell snippets) are fine
